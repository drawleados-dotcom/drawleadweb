 <!-- Industries as an overlapping stack of tall panels (Home 8 only; Home 7 keeps

 <div class="is-outer" id="isOuter">

     <span class="is-spine" aria-hidden="true">
      <i class="is-num"><?= str_pad((string) $isN, 2, '0', STR_PAD_LEFT) ?></i>
