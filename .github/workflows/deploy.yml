name: Deploy to Hostinger — admin.drawlead.com (staging)

# Runs on every push to main: uploads the changed files to the Hostinger
# subdomain via FTP/SFTP. It never deletes or overwrites includes/config.php
# on the server (that file is git-ignored, so it never appears in the
# checkout this action syncs from) and never touches uploads/ content for
# the same reason — only files tracked in this repo are synced.

# Runs queue rather than race. Two runs uploading over FTP at once can exhaust
# Hostinger's concurrent-connection limit, a plausible cause of the silent no-op
# deploys seen on 08cab9b, 9aa1023 and 7d3bfa4, where the run reports success but
# nothing reaches the server. cancel-in-progress stays false so a queued deploy is
# never dropped.
concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    name: FTP/SFTP deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Set to "sftp" instead of "ftps" in the repo's Actions secrets/
          # variables if your Hostinger plan gives you SSH/SFTP access —
          # see DEPLOYMENT.md. FTPS works on every Hostinger plan.
          protocol: ${{ vars.DEPLOY_PROTOCOL || 'ftps' }}
          port: ${{ vars.DEPLOY_PORT || 21 }}
          # admin.drawlead.com's document root, relative to the FTP
          # account's own root (which is already /public_html/). Override
          # with the DEPLOY_SERVER_DIR repo variable if this ever changes.
          server-dir: ${{ vars.DEPLOY_SERVER_DIR || '/drawlead_webapp/' }}
          dangerous-clean-slate: false
          # verbose output, so a failed transfer names the file and error it died on
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            **/sql/**
            **/*.md
