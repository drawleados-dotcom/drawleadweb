name: Deploy to Hostinger (staging: admin.drawlead.com)

# Runs on every push to main: uploads the changed files to the Hostinger
# subdomain via FTP/SFTP. It never deletes or overwrites includes/config.php
# on the server (that file is git-ignored, so it never appears in the
# checkout this action syncs from) and never touches uploads/ content for
# the same reason — only files tracked in this repo are synced.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    name: FTP/SFTP deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Set to "sftp" instead of "ftps" in the repo's Actions secrets/
          # variables if your Hostinger plan gives you SSH/SFTP access —
          # see DEPLOYMENT.md. FTPS works on every Hostinger plan.
          protocol: ${{ vars.DEPLOY_PROTOCOL || 'ftps' }}
          port: ${{ vars.DEPLOY_PORT || 21 }}
          # Must match the exact server folder Hostinger created for the
          # admin.drawlead.com subdomain — see DEPLOYMENT.md step 2.
          server-dir: ${{ vars.DEPLOY_SERVER_DIR || '/public_html/' }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/sql/**
            **/*.md
