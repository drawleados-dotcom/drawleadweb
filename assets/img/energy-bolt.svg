<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2880 1702" width="2880" height="1702" role="img" aria-label="">
  <!--
    Replaces the photographic energy-bolt.webp. Same 2880x1702 box and the same
    ~13% of empty space above the bolt, so the background-size maths in home7.css
    (auto calc(115vh - 117px), bottom anchored) still lands the tip in the same
    place. Transparent ground: the section's own #03080c shows through.
  -->
  <defs>
    <radialGradient id="floor" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#32b46f" stop-opacity=".42"/>
      <stop offset="55%" stop-color="#32b46f" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#32b46f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#32b46f" stop-opacity=".26"/>
      <stop offset="60%" stop-color="#32b46f" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#32b46f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ambient halo behind the bolt -->
  <ellipse cx="2300" cy="820" rx="620" ry="760" fill="url(#halo)"/>

  <!-- floor bloom the bolt appears to stand on -->
  <ellipse cx="2300" cy="1580" rx="700" ry="120" fill="url(#floor)"/>

  <!-- bolt: bright right face, darker left facet for depth -->
  <path d="M2400 130 L2110 830 L2290 830 L2150 1560 L2500 760 L2320 760 Z" fill="#32b46f"/>
  <path d="M2400 130 L2110 830 L2290 830 L2150 1560 L2300 1090 L2255 830 L2330 640 Z" fill="#14855a"/>

  <!-- highlight along the leading edge -->
  <path d="M2400 130 L2330 640 L2320 760 L2500 760 Z" fill="#5fd694" opacity=".85"/>

  <!-- reflection on the floor, flipped and faded -->
  <g opacity=".16" transform="translate(0,3120) scale(1,-1)">
    <path d="M2400 130 L2110 830 L2290 830 L2150 1560 L2500 760 L2320 760 Z" fill="#32b46f"/>
  </g>
</svg>
